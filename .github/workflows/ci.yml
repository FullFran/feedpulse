name: CI

# Fast quality gates. This workflow must never build a Docker image: it is the
# feedback loop a contributor waits on, and it targets a sub-3-minute run.
# The heavy stack verification lives in `smoke.yml`, which reuses this workflow
# through `workflow_call` and gates its Docker job behind `needs: quality`.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Exposed as a reusable workflow so `smoke.yml` can depend on the exact same
  # gate definition instead of duplicating the step list.
  workflow_call:

concurrency:
  # The `ci-` prefix is load-bearing, not decoration. `github.workflow` resolves
  # to the CALLER workflow name inside a reusable workflow, so without it a run
  # invoked from `smoke.yml` would claim the group `Smoke-<ref>` - the same
  # group its own caller holds - and cancel the caller mid-flight. The prefix
  # keeps the three cases disjoint: `ci-CI-<ref>` for a standalone run,
  # `ci-Smoke-<ref>` when nested, `Smoke-<ref>` for the caller.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # A real Postgres so the database-gated suites actually RUN in CI:
      # migrations, schema parity, the vertical slice, tenant isolation and the
      # canonical-link alert dedupe all guard themselves behind
      # TEST_DATABASE_URL. A suite that is permanently `describe.skip` in CI is
      # worse than no suite at all - it reports green while asserting nothing.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feedpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d feedpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Only TEST_DATABASE_URL is exported. The suites deliberately refuse to
      # reuse DATABASE_URL so a misconfigured job can never truncate a real
      # database.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/feedpulse_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:cov

      - name: Publish coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "coverage/coverage-summary.json";
            if (!fs.existsSync(path)) {
              console.log("No coverage summary found at " + path + "; skipping job summary.");
              process.exit(0);
            }
            const total = JSON.parse(fs.readFileSync(path, "utf8")).total;
            const rows = ["lines", "statements", "functions", "branches"]
              .filter((metric) => total[metric])
              .map((metric) => {
                const m = total[metric];
                return `| ${metric} | ${m.pct}% | ${m.covered}/${m.total} |`;
              });
            const md = [
              "## Coverage",
              "",
              "| Metric | % | Covered / Total |",
              "| --- | ---: | ---: |",
              ...rows,
              "",
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build
