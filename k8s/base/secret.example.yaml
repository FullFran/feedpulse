# Example only. Do NOT apply this file and do NOT commit real values.
#
# In a cluster these come from a secret manager (External Secrets Operator or
# the provider's CSI driver), never from a file in the repository. This exists
# so the required keys are discoverable without reading the env schema.
apiVersion: v1
kind: Secret
metadata:
  name: feedpulse-secrets
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://user:password@postgres:5432/feedpulse'
  REDIS_URL: 'redis://redis:6379'
  TENANT_SECRETS_MASTER_KEY: 'replace-me'
  METRICS_AUTH_TOKEN: 'replace-me'
  # KEDA's TriggerAuthentication reads this key. Empty string when Redis has
  # no password, but the key must exist or the ScaledObject fails to activate.
  REDIS_PASSWORD: ''
