apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedpulse-worker
  labels:
    app.kubernetes.io/name: feedpulse
    app.kubernetes.io/component: worker
spec:
  # Replica count is deliberately absent: KEDA owns it (see k8s/keda). Setting
  # it here would fight the ScaledObject on every apply.
  selector:
    matchLabels:
      app.kubernetes.io/name: feedpulse
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feedpulse
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Must exceed SHUTDOWN_TIMEOUT_MS. On SIGTERM the runtime stops accepting
      # jobs and drains the in-flight one; if the kubelet SIGKILLs first, that
      # job dies mid-flight and BullMQ only recovers it when its lock expires.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/fullfran/feedpulse:latest
          imagePullPolicy: IfNotPresent
          args: ["node", "dist/main/worker.js"]
          ports:
            - name: metrics
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: feedpulse-config
            - secretRef:
                name: feedpulse-secrets
          # The worker has no HTTP API, only the metrics server started by
          # src/main/worker-metrics-server.ts. A TCP check on that port is an
          # honest liveness signal: the process is up and its event loop is
          # accepting connections.
          #
          # Known limitation: this cannot distinguish "running" from "consuming".
          # A worker whose BullMQ connection dropped while the metrics server
          # stayed up would pass. Closing that gap needs a readiness endpoint
          # that reports worker connection state -- tracked separately.
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
