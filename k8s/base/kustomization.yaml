apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: feedpulse
commonLabels:
  app.kubernetes.io/part-of: feedpulse
resources:
  - configmap.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - scheduler.yaml
  - ingress.yaml
# secret.example.yaml is intentionally NOT listed: it is documentation, not a
# resource. Real secrets come from the cluster's secret manager.
images:
  - name: ghcr.io/fullfran/feedpulse
    newTag: latest
