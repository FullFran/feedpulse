# CI-only values. Safe to commit precisely because they are worthless: this
# namespace is destroyed with the kind cluster at the end of every run and is
# never reachable from outside the runner.
#
# Real deployments source these from a secret manager. See
# k8s/base/secret.example.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: feedpulse-secrets
type: Opaque
stringData:
  DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/rss_monitor'
  REDIS_URL: 'redis://redis:6379'
  REDIS_PASSWORD: ''
  TENANT_SECRETS_MASTER_KEY: 'ci-master-key-not-a-real-secret-000000000000'
  METRICS_AUTH_TOKEN: 'ci-metrics-token'
